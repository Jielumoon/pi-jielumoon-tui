name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 24 曾暴露 assert 消息生成的宿主差异；矩阵防止单版本验证的盲区。
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # .npmrc 已固化 legacy-peer-deps，npm ci 与本地安装保持一致。
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run pack:check
      - run: npm audit --omit=dev
